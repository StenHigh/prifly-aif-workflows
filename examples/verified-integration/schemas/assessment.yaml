id: aif-integration:schema/assessment
version: 1.0.0
$schema: https://json-schema.org/draft/2020-12/schema
type: object
required:
- status
- handoff_digest
- owner
- source_candidate
- target_commit
- integration_candidate
- integration_head
- session
- source_gates
- checks
- risks
- findings
- final_report
- final_gate
- operation
- cleanup
additionalProperties: false
properties:
  status:
    enum:
    - ready
    - needs_revision
    - owner_required
    - unavailable
    - reconcile_required
  handoff_digest:
    type: string
    pattern: ^sha256:[0-9a-f]{64}$
  owner:
    type: string
    minLength: 1
    maxLength: 80
  source_candidate:
    anyOf:
    - type: object
      required:
      - algorithm
      - base_commit
      - head_commit
      - index_digest
      - files_digest
      - digest
      additionalProperties: false
      properties:
        algorithm:
          const: git-candidate/1
        base_commit:
          type: string
          pattern: ^[0-9a-f]{40}$
        head_commit:
          type: string
          pattern: ^[0-9a-f]{40}$
        index_digest:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        files_digest:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        digest:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
    - type: 'null'
  target_commit:
    type: string
    pattern: ^[0-9a-f]{40}$
  integration_candidate:
    anyOf:
    - type: object
      required:
      - algorithm
      - base_commit
      - head_commit
      - index_digest
      - files_digest
      - digest
      additionalProperties: false
      properties:
        algorithm:
          const: git-candidate/1
        base_commit:
          type: string
          pattern: ^[0-9a-f]{40}$
        head_commit:
          type: string
          pattern: ^[0-9a-f]{40}$
        index_digest:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        files_digest:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        digest:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
    - type: 'null'
  integration_head:
    anyOf:
    - type: string
      pattern: ^[0-9a-f]{40}$
    - type: 'null'
  session:
    anyOf:
    - type: object
      required:
      - path
      - marker
      additionalProperties: false
      properties:
        path:
          type: string
          minLength: 1
          maxLength: 4000
        marker:
          type: object
          required:
          - owner
          - handoff_digest
          - attempt
          additionalProperties: false
          properties:
            owner:
              type: string
              minLength: 1
              maxLength: 80
            handoff_digest:
              type: string
              pattern: ^sha256:[0-9a-f]{64}$
            attempt:
              type: string
              minLength: 1
              maxLength: 4000
    - type: 'null'
  source_gates:
    type: array
    minItems: 0
    maxItems: 10
    items:
      type: object
      required:
      - role
      - gate
      - report_digest
      additionalProperties: false
      properties:
        role:
          type: string
          minLength: 1
          maxLength: 80
        gate:
          type: object
          required:
          - gate
          - status
          - blocking
          - blocking_owner_only
          - findings
          - suggested_next
          additionalProperties: false
          properties:
            gate:
              const: review
            status:
              enum:
              - passed
              - warnings
              - failed
              - blocked
            blocking:
              type: boolean
            blocking_owner_only:
              type: boolean
            findings:
              type: array
              maxItems: 240
              items:
                type: string
                minLength: 1
                maxLength: 4000
            suggested_next:
              enum:
              - continue
              - /aif-fix
        report_digest:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
  checks:
    type: array
    minItems: 0
    maxItems: 20
    items:
      type: object
      required:
      - id
      - argv
      - exit_code
      - stdout
      - stderr
      - stdout_digest
      - stderr_digest
      - truncated
      - result
      - reason
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 80
        argv:
          type: array
          minItems: 1
          maxItems: 40
          items:
            type: string
            minLength: 1
            maxLength: 4000
        exit_code:
          anyOf:
          - type: integer
          - type: 'null'
        stdout:
          type: string
          minLength: 0
          maxLength: 4000
        stderr:
          type: string
          minLength: 0
          maxLength: 4000
        stdout_digest:
          anyOf:
          - type: string
            pattern: ^sha256:[0-9a-f]{64}$
          - type: 'null'
        stderr_digest:
          anyOf:
          - type: string
            pattern: ^sha256:[0-9a-f]{64}$
          - type: 'null'
        truncated:
          type: boolean
        result:
          enum:
          - passed
          - failed
          - unavailable
        reason:
          type: string
          minLength: 0
          maxLength: 4000
  risks:
    type: array
    minItems: 0
    maxItems: 80
    items:
      type: object
      required:
      - category
      - reason
      - paths
      additionalProperties: false
      properties:
        category:
          enum:
          - auth_money
          - migrations
          - dependencies
          - deploy
          - business_assumptions
        reason:
          type: string
          minLength: 1
          maxLength: 4000
        paths:
          type: array
          minItems: 0
          maxItems: 10000
          items:
            type: string
            minLength: 1
            maxLength: 4000
  findings:
    type: array
    minItems: 0
    maxItems: 240
    items:
      type: string
      minLength: 1
      maxLength: 4000
  final_report:
    anyOf:
    - type: object
      required:
      - round
      - request_digest
      - candidate
      - session
      - model_profile
      - model
      - checks
      additionalProperties: false
      properties:
        request_digest:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        round:
          type: integer
          minimum: 1
          maximum: 10000
        candidate:
          type: object
          required:
          - algorithm
          - base_commit
          - head_commit
          - index_digest
          - files_digest
          - digest
          additionalProperties: false
          properties:
            algorithm:
              const: git-candidate/1
            base_commit:
              type: string
              pattern: ^[0-9a-f]{40}$
            head_commit:
              type: string
              pattern: ^[0-9a-f]{40}$
            index_digest:
              type: string
              pattern: ^sha256:[0-9a-f]{64}$
            files_digest:
              type: string
              pattern: ^sha256:[0-9a-f]{64}$
            digest:
              type: string
              pattern: ^sha256:[0-9a-f]{64}$
        session:
          enum:
          - separate
          - shared
          - unavailable
        model_profile:
          enum:
          - honoured
          - unavailable
          - declined
        model:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 4000
        checks:
          type: array
          maxItems: 80
          items:
            type: object
            required:
            - id
            - status
            - result
            - reason
            - evidence
            additionalProperties: false
            properties:
              id:
                type: string
                pattern: ^[a-z][a-z0-9_-]{0,79}$
              status:
                enum:
                - executed
                - unavailable
                - excluded
                - not_applicable
              result:
                enum:
                - passed
                - failed
                - warnings
                - not_run
              reason:
                type: string
                maxLength: 4000
              evidence:
                type: array
                maxItems: 40
                items:
                  type: object
                  required:
                  - method
                  - tool
                  - locator
                  - observation
                  - exit_code
                  additionalProperties: false
                  properties:
                    method:
                      enum:
                      - code
                      - command
                      - browser
                    tool:
                      type: string
                      minLength: 1
                      maxLength: 4000
                    locator:
                      type: string
                      minLength: 1
                      maxLength: 4000
                    observation:
                      type: string
                      minLength: 1
                      maxLength: 4000
                    exit_code:
                      type:
                      - integer
                      - 'null'
    - type: 'null'
  final_gate:
    anyOf:
    - type: object
      required:
      - gate
      - status
      - blocking
      - blocking_owner_only
      - findings
      - suggested_next
      additionalProperties: false
      properties:
        gate:
          const: review
        status:
          enum:
          - passed
          - warnings
          - failed
          - blocked
        blocking:
          type: boolean
        blocking_owner_only:
          type: boolean
        findings:
          type: array
          maxItems: 240
          items:
            type: string
            minLength: 1
            maxLength: 4000
        suggested_next:
          enum:
          - continue
          - /aif-fix
    - type: 'null'
  operation:
    anyOf:
    - type: 'null'
    - type: object
      required:
      - kind
      - status
      - target_repository
      - target_ref
      - before
      - after
      - handoff_digest
      - reason
      additionalProperties: false
      properties:
        kind:
          const: local_merge
        status:
          enum:
          - intent
          - applied
          - not_applied
        target_repository:
          type: string
          minLength: 1
          maxLength: 4000
        target_ref:
          type: string
          minLength: 1
          maxLength: 4000
        before:
          type: string
          pattern: ^[0-9a-f]{40}$
        after:
          type: string
          pattern: ^[0-9a-f]{40}$
        handoff_digest:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        reason:
          type: string
          minLength: 0
          maxLength: 4000
    - type: object
      required:
      - status
      - reason
      - identity
      - candidate_commit
      - target_commit
      - handoff_digest
      - url
      - observed_target_commit
      - body_digest
      - revision
      additionalProperties: false
      properties:
        status:
          enum:
          - created
          - reused
          - reconcile_required
        reason:
          type: string
          minLength: 0
          maxLength: 4000
        identity:
          type: string
          minLength: 1
          maxLength: 4000
        candidate_commit:
          type: string
          pattern: ^[0-9a-f]{40}$
        target_commit:
          type: string
          pattern: ^[0-9a-f]{40}$
        handoff_digest:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        url:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 4000
          - type: 'null'
        observed_target_commit:
          anyOf:
          - type: string
            pattern: ^[0-9a-f]{40}$
          - type: 'null'
        body_digest:
          anyOf:
          - type: string
            pattern: ^sha256:[0-9a-f]{64}$
          - type: 'null'
        revision:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
  cleanup:
    enum:
    - not_needed
    - required
    - released
    - reconcile_required

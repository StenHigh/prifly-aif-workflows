id: aif-integration:schema/handoff
version: 1.0.0
$schema: https://json-schema.org/draft/2020-12/schema
type: object
required:
- owner
- candidate_commit
- target
- mode
- acceptance
- integrated_checks
- spot_checks
- policy
- risk_approval
- require_separate_session
- optional_policy
- publication
additionalProperties: false
properties:
  owner:
    type: string
    pattern: ^[a-z][a-z0-9_-]{0,79}$
  candidate_commit:
    type: string
    pattern: ^[0-9a-f]{40}$
  target:
    type: object
    required:
    - repository
    - ref
    - commit
    additionalProperties: false
    properties:
      repository:
        type: string
        minLength: 1
        maxLength: 4000
      ref:
        type: string
        minLength: 1
        maxLength: 4000
      commit:
        type: string
        pattern: ^[0-9a-f]{40}$
  mode:
    enum:
    - assess
    - local_merge
    - gitlab_draft
  acceptance:
    type: array
    minItems: 1
    maxItems: 10
    items:
      type: object
      required:
      - role
      - request_text
      - report
      additionalProperties: false
      properties:
        role:
          type: string
          minLength: 1
          maxLength: 80
        request_text:
          type: string
          minLength: 1
          maxLength: 1048576
        report:
          type: object
          required:
          - round
          - request_digest
          - candidate
          - session
          - model_profile
          - model
          - checks
          additionalProperties: false
          properties:
            request_digest:
              type: string
              pattern: ^sha256:[0-9a-f]{64}$
            round:
              type: integer
              minimum: 1
              maximum: 10000
            candidate:
              type: object
              required:
              - algorithm
              - base_commit
              - head_commit
              - index_digest
              - files_digest
              - digest
              additionalProperties: false
              properties:
                algorithm:
                  const: git-candidate/1
                base_commit:
                  type: string
                  pattern: ^[0-9a-f]{40}$
                head_commit:
                  type: string
                  pattern: ^[0-9a-f]{40}$
                index_digest:
                  type: string
                  pattern: ^sha256:[0-9a-f]{64}$
                files_digest:
                  type: string
                  pattern: ^sha256:[0-9a-f]{64}$
                digest:
                  type: string
                  pattern: ^sha256:[0-9a-f]{64}$
            session:
              enum:
              - separate
              - shared
              - unavailable
            model_profile:
              enum:
              - honoured
              - unavailable
              - declined
            model:
              type:
              - string
              - 'null'
              minLength: 1
              maxLength: 4000
            checks:
              type: array
              maxItems: 80
              items:
                type: object
                required:
                - id
                - status
                - result
                - reason
                - evidence
                additionalProperties: false
                properties:
                  id:
                    type: string
                    pattern: ^[a-z][a-z0-9_-]{0,79}$
                  status:
                    enum:
                    - executed
                    - unavailable
                    - excluded
                    - not_applicable
                  result:
                    enum:
                    - passed
                    - failed
                    - warnings
                    - not_run
                  reason:
                    type: string
                    maxLength: 4000
                  evidence:
                    type: array
                    maxItems: 40
                    items:
                      type: object
                      required:
                      - method
                      - tool
                      - locator
                      - observation
                      - exit_code
                      additionalProperties: false
                      properties:
                        method:
                          enum:
                          - code
                          - command
                          - browser
                        tool:
                          type: string
                          minLength: 1
                          maxLength: 4000
                        locator:
                          type: string
                          minLength: 1
                          maxLength: 4000
                        observation:
                          type: string
                          minLength: 1
                          maxLength: 4000
                        exit_code:
                          type:
                          - integer
                          - 'null'
  integrated_checks:
    type: array
    minItems: 1
    maxItems: 20
    items:
      type: object
      required:
      - id
      - description
      - argv
      - timeout_seconds
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: string
          minLength: 1
          maxLength: 4000
        argv:
          type: array
          minItems: 1
          maxItems: 40
          items:
            type: string
            minLength: 1
            maxLength: 4000
        timeout_seconds:
          type: integer
          minimum: 1
          maximum: 120
  spot_checks:
    type: array
    minItems: 1
    maxItems: 80
    items:
      type: object
      required:
      - id
      - description
      - method
      - required
      - enabled
      - applicable
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: ^[a-z][a-z0-9_-]{0,79}$
        description:
          type: string
          minLength: 1
          maxLength: 4000
        method:
          enum:
          - code
          - command
          - browser
        required:
          type: boolean
        enabled:
          type: boolean
        applicable:
          type: boolean
  policy:
    type: object
    required:
    - escalation_paths
    - declared_risks
    additionalProperties: false
    properties:
      escalation_paths:
        type: object
        required:
        - auth_money
        - migrations
        - dependencies
        - deploy
        - business_assumptions
        additionalProperties: false
        properties:
          auth_money:
            type: array
            minItems: 0
            maxItems: 40
            items:
              type: string
              minLength: 1
              maxLength: 4000
          migrations:
            type: array
            minItems: 0
            maxItems: 40
            items:
              type: string
              minLength: 1
              maxLength: 4000
          dependencies:
            type: array
            minItems: 0
            maxItems: 40
            items:
              type: string
              minLength: 1
              maxLength: 4000
          deploy:
            type: array
            minItems: 0
            maxItems: 40
            items:
              type: string
              minLength: 1
              maxLength: 4000
          business_assumptions:
            type: array
            minItems: 0
            maxItems: 40
            items:
              type: string
              minLength: 1
              maxLength: 4000
      declared_risks:
        type: array
        minItems: 0
        maxItems: 40
        items:
          type: object
          required:
          - category
          - reason
          additionalProperties: false
          properties:
            category:
              enum:
              - auth_money
              - migrations
              - dependencies
              - deploy
              - business_assumptions
            reason:
              type: string
              minLength: 1
              maxLength: 4000
  risk_approval:
    anyOf:
    - type: object
      required:
      - candidate_commit
      - target_commit
      - policy_digest
      - categories
      - reference
      - reason
      additionalProperties: false
      properties:
        candidate_commit:
          type: string
          pattern: ^[0-9a-f]{40}$
        target_commit:
          type: string
          pattern: ^[0-9a-f]{40}$
        policy_digest:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        categories:
          type: array
          minItems: 0
          maxItems: 5
          items:
            enum:
            - auth_money
            - migrations
            - dependencies
            - deploy
            - business_assumptions
        reference:
          type: string
          minLength: 1
          maxLength: 4000
        reason:
          type: string
          minLength: 1
          maxLength: 4000
    - type: 'null'
  require_separate_session:
    type: boolean
  optional_policy:
    enum:
    - ignore
    - stop
  publication:
    anyOf:
    - type: object
      required:
      - project
      - source_branch
      - target_branch
      - title
      - body
      - identity
      additionalProperties: false
      properties:
        project:
          type: string
          minLength: 1
          maxLength: 4000
        source_branch:
          type: string
          minLength: 1
          maxLength: 4000
        target_branch:
          type: string
          minLength: 1
          maxLength: 4000
        title:
          type: string
          minLength: 1
          maxLength: 4000
        body:
          type: string
          minLength: 1
          maxLength: 4000
        identity:
          type: string
          minLength: 1
          maxLength: 4000
    - type: 'null'

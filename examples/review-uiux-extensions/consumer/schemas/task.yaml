{
  "id": "w6-example:schema/task",
  "version": "1.0.0",
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "type": "object",
  "required": [
    "title",
    "description",
    "base_commit"
  ],
  "additionalProperties": false,
  "properties": {
    "title": {
      "type": "string",
      "minLength": 1
    },
    "description": {
      "type": "string",
      "minLength": 1
    },
    "base_commit": {
      "type": "string",
      "pattern": "^[0-9a-f]{40}$"
    }
  }
}

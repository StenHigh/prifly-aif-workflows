{
  "authoring": "prifly-project-workflow/1",
  "package": {
    "id": "w6-example:package/consumer",
    "version": "1.0.0",
    "description": "Explicit project consumer for native review/UIUX call extensions.",
    "requires_core_protocol": "1",
    "references": {
      "session": "core:adapter/assisted-session@1.0.0",
      "policy": "core:policy/local@4.0.0",
      "result": "core:schema/step-result@1.0.0"
    }
  },
  "id": "w6-example:workflow/consumer",
  "schema_version": "8",
  "version": "1.0.0",
  "title": "Project feature and optional acceptance",
  "refs": {
    "task": "{{schema_task}}",
    "implementation": "{{schema_implementation}}",
    "write": "{{step_write}}",
    "commit": "{{step_commit}}",
    "policy": "{{policy}}"
  },
  "inputs": {
    "task": {
      "schema_ref": "task"
    }
  },
  "outputs": {
    "implementation": {
      "schema_ref": "implementation",
      "required_for": [
        "succeeded"
      ]
    }
  },
  "resumable": {
    "from_outcomes": [
      "partial",
      "rejected"
    ],
    "from_cancelled": true
  },
  "policy_ref": "policy",
  "entry": "write",
  "limits": {
    "max_step_instances": 32,
    "max_control_transitions": 120,
    "max_parallelism": 1,
    "max_child_depth": 4
  },
  "stages": {
    "write": {
      "kind": "step",
      "step_ref": "write",
      "input_bindings": {
        "task": "$inputs.task"
      },
      "on": {
        "pass": "commit",
        "fail": "abandoned",
        "needs_revision": "abandoned",
        "no_work": "abandoned"
      },
      "impossible_verdicts": [
        "blocked"
      ]
    },
    "commit": {
      "kind": "step",
      "step_ref": "commit",
      "input_bindings": {
        "implementation": "$stages.write.implementation"
      },
      "on": {
        "pass": "done",
        "fail": "abandoned",
        "needs_revision": "abandoned",
        "no_work": "abandoned"
      },
      "impossible_verdicts": [
        "blocked"
      ]
    },
    "done": {
      "kind": "finish",
      "outcome": "succeeded",
      "output_bindings": {
        "implementation": "$stages.commit.implementation"
      }
    },
    "abandoned": {
      "kind": "finish",
      "outcome": "rejected"
    }
  }
}

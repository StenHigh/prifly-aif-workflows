{
  "id": "w6:schema/w6-product-applicability",
  "version": "1.0.0",
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "type": "object",
  "additionalProperties": false,
  "required": [
    "status",
    "reason",
    "task_digest",
    "candidate"
  ],
  "properties": {
    "status": {
      "enum": [
        "required",
        "not-required",
        "unknown"
      ]
    },
    "reason": {
      "type": "string",
      "minLength": 1,
      "maxLength": 4000
    },
    "task_digest": {
      "type": "string",
      "pattern": "^sha256:[0-9a-f]{64}$"
    },
    "candidate": {
      "type": "object",
      "required": [
        "algorithm",
        "base_commit",
        "head_commit",
        "index_digest",
        "files_digest",
        "digest"
      ],
      "additionalProperties": false,
      "properties": {
        "algorithm": {
          "const": "git-candidate/1"
        },
        "base_commit": {
          "type": "string",
          "pattern": "^[0-9a-f]{40}$"
        },
        "head_commit": {
          "type": "string",
          "pattern": "^[0-9a-f]{40}$"
        },
        "index_digest": {
          "type": "string",
          "pattern": "^sha256:[0-9a-f]{64}$"
        },
        "files_digest": {
          "type": "string",
          "pattern": "^sha256:[0-9a-f]{64}$"
        },
        "digest": {
          "type": "string",
          "pattern": "^sha256:[0-9a-f]{64}$"
        }
      }
    },
    "source_report": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "artifact_id",
        "revision",
        "digest"
      ],
      "properties": {
        "artifact_id": {
          "type": "string",
          "pattern": "^[A-Za-z][A-Za-z0-9._:/-]{0,127}$"
        },
        "revision": {
          "type": "integer",
          "minimum": 1,
          "maximum": 9007199254740991
        },
        "digest": {
          "type": "string",
          "pattern": "^sha256:[0-9a-f]{64}$"
        }
      }
    }
  }
}

{
  "authoring": "prifly-workflow/1",
  "schema_version": "6",
  "id": "w6:workflow/w6-review",
  "version": "1.0.0",
  "title": "Project review acceptance",
  "refs": {
    "prepare": "{{step_w6-review-prepare}}",
    "seal": "{{step_w6-review-seal}}",
    "implementation": "{{schema_implementation}}",
    "candidate": "{{schema_w6-candidate}}",
    "receipt": "{{schema_w6-receipt}}",
    "assessment": "{{schema_w6-assessment}}",
    "policy": "{{w6-policy}}",
    "review": "{{workflow_w6-review-quality}}",
    "review_gate": "{{schema_w6-review-gate}}",
    "review_report": "{{schema_w6-review-report}}",
    "request": "{{schema_w6-review-request}}",
    "review_diagnostic": "{{step_w6-review-review-diagnostic}}"
  },
  "inputs": {
    "implementation": "implementation"
  },
  "outputs": {
    "receipt": {
      "schema_ref": "receipt",
      "required_for": [
        "succeeded"
      ]
    },
    "assessment": {
      "schema_ref": "assessment",
      "required_for": [
        "succeeded",
        "partial"
      ]
    },
    "review_gate": {
      "schema_ref": "review_gate",
      "required_for": [
        "succeeded"
      ]
    },
    "review_report": {
      "schema_ref": "review_report",
      "required_for": [
        "succeeded"
      ]
    }
  },
  "entry": "prepare",
  "policy_ref": "policy",
  "limits": {
    "max_step_instances": 12,
    "max_control_transitions": 60,
    "max_parallelism": 1,
    "max_child_depth": 2
  },
  "stages": {
    "prepare": {
      "kind": "step",
      "step_ref": "prepare",
      "input_bindings": {
        "implementation": "$inputs.implementation"
      },
      "on": {
        "pass": "review",
        "fail": "rejected",
        "needs_revision": "rejected",
        "no_work": "rejected"
      },
      "impossible_verdicts": [
        "blocked"
      ]
    },
    "review": {
      "kind": "call",
      "workflow_ref": "review",
      "input_bindings": {
        "request": "$stages.prepare.request"
      },
      "on": {
        "succeeded": "seal",
        "partial": "review-diagnostic",
        "rejected": "rejected"
      }
    },
    "review-diagnostic": {
      "kind": "step",
      "step_ref": "review_diagnostic",
      "input_bindings": {
        "candidate": "$stages.prepare.candidate",
        "gate": "$stages.review.gate",
        "review_report": "$stages.review.report"
      },
      "on": {
        "pass": "review-partial",
        "fail": "rejected",
        "needs_revision": "rejected",
        "no_work": "rejected"
      },
      "impossible_verdicts": [
        "blocked"
      ]
    },
    "review-partial": {
      "kind": "finish",
      "outcome": "partial",
      "output_bindings": {
        "assessment": "$stages.review-diagnostic.assessment"
      }
    },
    "seal": {
      "kind": "step",
      "step_ref": "seal",
      "input_bindings": {
        "implementation": "$stages.prepare.implementation",
        "candidate": "$stages.prepare.candidate",
        "review_gate": "$stages.review.gate",
        "review_report": "$stages.review.report"
      },
      "on": {
        "pass": "done",
        "fail": "rejected",
        "needs_revision": "rejected",
        "no_work": "rejected"
      },
      "impossible_verdicts": [
        "blocked"
      ]
    },
    "done": {
      "kind": "finish",
      "outcome": "succeeded",
      "output_bindings": {
        "receipt": "$stages.seal.receipt",
        "assessment": "$stages.seal.assessment",
        "review_gate": "$stages.review.gate",
        "review_report": "$stages.review.report"
      }
    },
    "rejected": {
      "kind": "finish",
      "outcome": "rejected"
    }
  }
}

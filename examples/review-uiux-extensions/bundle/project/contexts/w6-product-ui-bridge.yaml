{
  "id": "w6:context/w6-product-ui-bridge",
  "version": "1.0.0",
  "media_type": "text/markdown; charset=utf-8",
  "text": "Inspect the existing design system and actual page at every declared desktop/mobile viewport. Assess hierarchy, spacing, typography, overflow and contrast against declared expectations. Save meaningful observations/screenshots in task output workspace, never in the repository. Do not replace visual inspection with only DOM metrics.\nFollow the pinned W1 review-bridge exactly for the report and verdict. Report evidence only for scenarios with lens ui and the matching check_id in the delivered request. Never include another lens or check in an evidence entry. Read the sealed configuration.scenarios for this lens and environment receipt. Check every declared scenario; record its ID, path and actual viewport in browser evidence observation. The request already binds these scenarios in each check description. A missing browser/server is unavailable, not not_applicable. Only a ready receipt for this candidate permits browser checks; other statuses require unavailable for enabled applicable checks. A not_needed receipt applies only to predeclared skips. Backend-only not_applicable reason must cite configuration.scope_reason. Use a fresh browser context for this lens, never a reused login/profile from another job. No installation, server start, transition, release or repair here.\nBrowser evidence serialization: observation is a JSON STRING with exactly scenario, viewport, url, observations. Scenario is the exact configured ID for this lens/check; viewport copies its configured width/height; url is environment.url without trailing slash plus scenario.path; observations is nonempty prose of actual observed facts. locator must equal that exact URL ONLY. Put selectors, screenshot paths and details in observations, never append them to locator. One evidence entry per declared scenario; no other lens/check scenarios. This complements the pinned W1 report schema.\nNative session submission model_profile is distinct from the typed report fields: its object uses outcome plus named for honoured, or outcome plus reason for unavailable/declined. reason is the literal key; unavailable_reason is invalid. Do not include named or model for unavailable/declined. Follow the submission template identity fields unchanged.\n"
}

<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Fixture notes</title>
<style>
:root { color-scheme: light; --ink:#172033; --accent:#1745a1; --paper:#f4f6fa; }
* { box-sizing:border-box; } body { margin:0; background:var(--paper); color:var(--ink); font:16px/1.5 system-ui,sans-serif; }
main { width:min(100% - 32px,680px); margin:32px auto; } h1 { font-size:28px; } section { padding:24px; border:1px solid #ccd3df; border-radius:12px; background:white; }
label,input,button { display:block; } input { width:100%; padding:10px; font:inherit; border:1px solid #6c778e; border-radius:6px; }
button { margin-top:16px; padding:10px 20px; color:white; background:var(--accent); border:0; border-radius:6px; font:inherit; cursor:pointer; }
:focus-visible { outline:3px solid #d36600; outline-offset:3px; } [role=alert] { color:#a41b25; } [hidden] { display:none!important; }
/* DEFECT_OVERFLOW */
</style><main><h1>Notes</h1><section><h2>Add a note</h2><form id="form" novalidate><label for="note">Note text</label><input id="note" name="note" autocomplete="off"><button id="save">Save note</button></form>
<p id="error" role="alert" hidden>Please enter a note.</p><p id="loading" role="status" hidden>Saving…</p><p id="empty">No notes yet.</p><p id="success" role="status" hidden></p></section></main>
<script>
const form=document.querySelector('#form'), note=document.querySelector('#note');
form.addEventListener('submit',event=>{event.preventDefault();
 document.querySelector('#error').hidden=true;
 if(!note.value.trim()){document.querySelector('#error').hidden=false;note.focus();return;}
 document.querySelector('#loading').hidden=false;document.querySelector('#save').disabled=true;
 setTimeout(()=>{document.querySelector('#loading').hidden=true;document.querySelector('#save').disabled=false;
 /* DEFECT_FLOW */
 document.querySelector('#empty').hidden=true;document.querySelector('#success').hidden=false;
 document.querySelector('#success').textContent='Saved: '+note.value.trim();note.value='';note.focus();},400);
});
</script></html>

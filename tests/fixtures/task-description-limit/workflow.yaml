authoring: prifly-project-workflow/3
package:
  id: limit-probe:package/probe
  version: 1.0.0
  description: Isolated project task description limit probe.
  requires_core_protocol: "1"
  profiles:
    default: standard
    values:
      standard: {task_description_limit: 12000}
      expanded: {task_description_limit: 32000}
  references:
    adapter: core:adapter/assisted-session@1.0.0
    result: core:schema/step-result@2.0.0
    policy: core:policy/local@4.0.0
id: limit-probe:workflow/root
version: 1.0.0
schema_version: "6"
title: Carry the same task through root child and worker
refs:
  task: "{{schema_task}}"
  positive_integer: "{{schema_positive-integer}}"
  child: "{{workflow_child}}"
  policy: "{{policy}}"
inputs:
  task: {schema_ref: task}
  task_description_limit:
    schema_ref: positive_integer
    required: false
    configuration: {scope: project, default: "{{task_description_limit}}"}
outputs:
  task: {schema_ref: task, required_for: [succeeded]}
policy_ref: policy
limits: {max_step_instances: 2, max_control_transitions: 8, max_child_depth: 2}
entry: child
stages:
  child:
    kind: call
    workflow_ref: child
    input_bindings: {task: $inputs.task}
    on: {succeeded: done, rejected: stopped}
    on_error: stopped
  done:
    kind: finish
    outcome: succeeded
    output_bindings: {task: $stages.child.task}
  stopped: {kind: finish, outcome: rejected}

authoring: prifly-step/2
id: probe:step/planned
version: 1.0.0
title: Represent the planned branch with a native plan capture
kind: worker
outputs:
  implementation: {schema_ref: "{{schema_implementation}}", required_for: [pass]}
  plan: {schema_ref: "{{workspace_tree_manifest}}", required_for: [pass]}
executor: {adapter_ref: "{{assisted_adapter}}", operation: session}
instructions_ref: "{{context_brief}}"
effects: {class: workspace_write, retry_class: never}
session_limits: {active_timeout_ms: null}
result_schema_ref: "{{step_result_schema}}"
workspace_trees:
  - output_port: plan
    capture: {kind: exact_file, path: probe/PLAN.md}

authoring: prifly-step/2
id: probe:step/tail
version: 1.0.0
title: Represent the common tail consuming the merged outputs
kind: worker
inputs:
  implementation: {schema_ref: "{{schema_implementation}}"}
  plan: {schema_ref: "{{workspace_tree_manifest}}", required: false}
outputs:
  implementation: {schema_ref: "{{schema_implementation}}", required_for: [pass]}
executor: {adapter_ref: "{{assisted_adapter}}", operation: session}
instructions_ref: "{{context_brief}}"
effects: {class: none, retry_class: pure}
session_limits: {active_timeout_ms: null}
result_schema_ref: "{{step_result_schema}}"

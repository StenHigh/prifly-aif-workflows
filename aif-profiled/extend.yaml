authoring: prifly-extension/5
# Task length: Core >=0.13.90 reads project/compile-values.yaml.
# Use {authoring: prifly-compile-values/1, values: {task_description_limit: 32000}}.
# Omit the owner file to keep 12000. This is a compile parameter, not settings.
# Project controls are intentionally small. `exclude` selects a declared
# bypass; it does not delete a graph stage or pretend that a skipped gate passed.
profile: fast # `full` and `ultra` use their documented native AIF plan layouts.
settings:
  improve-batch: {improve_round_limit: 3}
  improve-series: {improve_batch_limit: 3}
exclude: []
# How this project turns a step's model profile into a model and an effort,
# per host. Pri-Fly carries the entry into the step's task as
# `model_profile_translation` and reads none of it: the words are the host's
# own. Edit for your team; a developer overrides an entry on their machine
# with `prifly project local set --model-profile "claude-code deep-reasoning model=opus effort=high"`
# (the local entry replaces the whole entry, keys are not merged). A profile
# with no entry for the host you start on travels without a translation, and
# the host answers `unavailable` — a true record, not a failure.
model_profiles:
  claude-code:
    deep-reasoning: {model: opus, effort: high}
    careful-review: {model: opus, effort: medium}
    fast-draft: {model: sonnet, effort: low}
    independent-review: {model: sonnet, effort: medium}
  codex-cli:
    deep-reasoning: {model: gpt-5, reasoning_effort: high}
    careful-review: {model: gpt-5, reasoning_effort: medium}
    fast-draft: {model: gpt-5-mini, reasoning_effort: low}
    independent-review: {model: gpt-5-mini, reasoning_effort: medium}
  codex-app:
    deep-reasoning: {model: gpt-5, reasoning_effort: high}
    careful-review: {model: gpt-5, reasoning_effort: medium}
    fast-draft: {model: gpt-5-mini, reasoning_effort: low}
    independent-review: {model: gpt-5-mini, reasoning_effort: medium}
# `extensions` adds a step of your own through the explicit /5 contract.
# Core >=0.13.85. For nested measurement use declared before-verify or
# before-review points. The package fixes inputs/routes/consumer aliases;
# project/** owns the Step or typed Call and each consumer needs a binding.
# Omit an implementation or use enabled:false for unchanged passthrough.
# Root route insertions remain available; examples/unified-composition shows
# complete preparation, execution consent and public component imports.
# Root insertion example; between names existing direct routes only:
#   between: {from: implement, to: verify}
# extensions:
#   - id: merge-request
#     workflow: classic
#     step: merge-request
#     between: {from: commit, to: done}
#     on: {pass: done, needs_revision: abandoned, fail: abandoned, no_work: abandoned}
#     impossible_verdicts: [blocked]
extensions: []

id: aif:schema/gate-result
version: 1.0.0
$schema: https://json-schema.org/draft/2020-12/schema
type: object
required: [gate, status, blocking, findings, suggested_next]
additionalProperties: false
properties:
  gate: {enum: [verify, security, review]}
  status: {enum: [passed, warnings, failed]}
  blocking: {type: boolean}
  findings:
    type: array
    maxItems: 80
    items: {type: string, minLength: 1, maxLength: 4000}
  suggested_next: {enum: [continue, "/aif-fix"]}

id: aif:context/aif-plan-bridge
version: 1.0.0
media_type: text/markdown; charset=utf-8
text: |
  # Pri-Fly adapter for the pinned aif-plan skill

  The following supporting context is the pinned upstream `aif-plan` skill.
  Apply its planning procedure, but this adapter owns the handoff of already
  declared Pri-Fly choices.

  `decision_sheet.package_profile` is the selected leading AIF mode: invoke
  the skill as `aif-plan fast`, `aif-plan full`, or `aif-plan ultra` for that
  exact value. `decision_context` contains any applicable preflight values:
  `plan_tests`, `plan_logging`, `plan_docs`, `roadmap_linkage`,
  `roadmap_milestone`, and `plan_constraints`. They are choices already made
  for this Run. Use them and do not repeat the corresponding native questions.

  Do not set `HANDOFF_MODE=1` to suppress questions: it has different defaults
  and is not a Pri-Fly decision protocol. If the upstream skill needs a
  question that this adapter has not declared, keep it as normal attended host
  interaction; never pretend it was a Pri-Fly DecisionRequest.

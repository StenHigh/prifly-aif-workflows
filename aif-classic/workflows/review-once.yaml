authoring: prifly-workflow/1
id: aif:workflow/review-once
version: 1.0.0
title: Review the implementation once and fix what blocks it
refs:
  schema_implementation: "{{schema_implementation}}"
  schema_gate-result: "{{schema_gate-result}}"
  schema_warmup-handoff: "{{schema_warmup-handoff}}"
  step_review: "{{step_review}}"
  step_fix: "{{step_fix}}"
  local_policy: "{{local_policy}}"
inputs:
  implementation: schema_implementation
  handoff: schema_warmup-handoff
outputs:
  implementation: {schema_ref: schema_implementation, required_for: [succeeded, partial]}
  gate: {schema_ref: schema_gate-result, required_for: [partial, rejected]}
limits: {max_step_instances: 2, max_control_transitions: 16, max_parallelism: 1, max_child_depth: 1}
policy_ref: local_policy
entry: review
stages:
  review:
    kind: step
    step_ref: step_review
    input_bindings: {implementation: $inputs.implementation}
    on: {pass: decide}
  decide:
    kind: choice
    selection: exclusive
    branches:
      - id: blocking
        predicate: {op: eq, left: $stages.review.gate#/blocking, right: true}
        next: fix
    default: clean
  fix:
    kind: step
    step_ref: step_fix
    input_bindings:
      gate: $stages.review.gate
      implementation: $inputs.implementation
      handoff: $inputs.handoff
    on: {pass: fixed, needs_revision: unresolved}
  clean:
    kind: finish
    outcome: succeeded
    output_bindings: {implementation: $inputs.implementation}
  fixed:
    kind: finish
    outcome: partial
    output_bindings: {implementation: $stages.fix.implementation, gate: $stages.review.gate}
    description: Blockers were fixed; the caller reviews the changed implementation again.
  unresolved:
    kind: finish
    outcome: rejected
    output_bindings: {gate: $stages.review.gate}
    description: The fix step found no safe change it could make; the findings stand.

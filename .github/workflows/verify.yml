name: verify

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Pri-Fly from the latest stable release
        run: |
          install_file="$(mktemp)"
          curl --fail --location --silent --show-error \
            https://github.com/StenHigh/prifly/releases/latest/download/install.sh \
            -o "$install_file"
          sh "$install_file"
          rm -f "$install_file"
          "$HOME/.local/bin/prifly" version
      - name: Released versions moved with the bytes
        run: python3 -B tests/test_versions.py
      - name: Static folder contract
        run: python3 -B tests/test_folders.py
      - name: Explicit review coverage and dirty candidate identity
        run: python3 -B tests/test_review_evidence.py
      - name: Test audit selection, evidence coverage and candidate freshness
        run: python3 -B tests/test_test_audit.py
      - name: Product review coverage and owned environment lifecycle
        run: python3 -B tests/test_product_review.py
      - name: Feature admission, whole-round freshness and owner blockers
        run: python3 -B tests/test_feature.py
      - name: Parallel report transport rejects substituted refs and bytes
        run: python3 -B tests/test_parallel_reports.py
      - name: Verified integration freshness, semantic regression and owned publication
        run: python3 -B tests/test_integration.py
      - name: Compile all packages with the installed Pri-Fly
        run: python3 -B tests/verify.py --binary "$HOME/.local/bin/prifly"
      - name: One authority carries Classic across every plan profile
        run: python3 -B tests/compatibility.py --binary "$HOME/.local/bin/prifly"
      - name: Standalone integration graph and one-input extension contracts
        run: python3 -B tests/integration_contract.py --binary "$HOME/.local/bin/prifly"
      - name: Parallel review qualification contracts on three hosts
        run: python3 -B tests/parallel_contract.py --binary "$HOME/.local/bin/prifly"
      - name: A real Run is handed past the verify gate
        run: python3 -B tests/probes/run_check.py --binary "$HOME/.local/bin/prifly" --check --verdict pass
      - name: A gate that could not judge ends the Run partial with its gate
        run: python3 -B tests/probes/run_check.py --binary "$HOME/.local/bin/prifly" --check --verdict blocked
      - name: A Run stopped blocked resumes with the same workflow at verify
        run: python3 -B tests/probes/run_check.py --binary "$HOME/.local/bin/prifly" --check --resume
      - name: A Run cancelled at the gate resumes with the same workflow
        run: python3 -B tests/probes/run_check.py --binary "$HOME/.local/bin/prifly" --check --resume --verdict cancelled
      - name: Bug workflow finishes direct, planned, repaired and resumed Runs
        run: python3 -B tests/probes/fix_check.py --binary "$HOME/.local/bin/prifly" --report /tmp/aif-fix-results.json
      - name: Explicit review evidence finishes and resumes on the released runtime
        run: python3 -B tests/probes/evidence_check.py --binary "$HOME/.local/bin/prifly" --report /tmp/aif-evidence-results.json
      - name: Standalone test audit skips, reports, stops and replays
        run: python3 -B tests/probes/test_audit_check.py --binary "$HOME/.local/bin/prifly" --report /tmp/openclaw-test-audit-results.json
      - name: OpenClaw test audit catalog install without AI Factory skills
        run: python3 -B tests/test_audit_install.py --binary "$HOME/.local/bin/prifly"
      - name: UI and UX components finish, block and resume with owned environments
        run: python3 -B tests/probes/product_check.py --binary "$HOME/.local/bin/prifly" --report /tmp/aif-product-results.json
      - name: Standalone feature catalog install and update preserve project ownership
        run: python3 -B tests/feature_install.py --binary "$HOME/.local/bin/prifly"
      - name: Small feature direct, repaired, stopped and resumed Runs
        run: python3 -B tests/probes/feature_check.py --binary "$HOME/.local/bin/prifly" --report /tmp/aif-feature-results.json
      - name: Whole feature parallel review, sealed reports and full-round replay
        run: python3 -B tests/probes/feature_parallel_check.py --binary "$HOME/.local/bin/prifly" --jobs 3 --report /tmp/aif-feature-parallel-results.json
      - name: Exact merged acceptance, explicit local integration and offline publication
        run: python3 -B tests/probes/integration_check.py --binary "$HOME/.local/bin/prifly" --report /tmp/aif-integration-results.json
      - name: Parallel readers, all-join barriers and whole-round recovery
        run: python3 -B tests/probes/parallel_check.py --binary "$HOME/.local/bin/prifly" --report /tmp/aif-parallel-results.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the exact browser fixture tool
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix tests/fixtures/product
          tests/fixtures/product/node_modules/.bin/playwright install --with-deps chromium
      - name: Real browser scenarios, defects, repair and cancellation
        run: |
          python3 -B tests/probes/product_check.py --binary "$HOME/.local/bin/prifly" \
            --browser-library "$PWD/tests/fixtures/product/node_modules/playwright" \
            --report /tmp/aif-product-browser-results.json
      - name: Small frontend feature with real browser and full quality replay
        run: |
          python3 -B tests/probes/feature_check.py --binary "$HOME/.local/bin/prifly" \
            --browser-library "$PWD/tests/fixtures/product/node_modules/playwright" \
            --report /tmp/aif-feature-browser-results.json
  parallel-ui-ux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Pri-Fly from the latest stable release
        run: |
          prifly_installer="$(mktemp)"
          curl --fail --location --silent --show-error \
            https://github.com/StenHigh/prifly/releases/latest/download/install.sh \
            -o "$prifly_installer"
          sh "$prifly_installer"
          rm -f "$prifly_installer"
          "$HOME/.local/bin/prifly" version
      - name: Parallel UI and UX qualification retains the W2 contracts on three hosts
        run: python3 -B tests/parallel_product_contract.py --binary "$HOME/.local/bin/prifly"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the exact browser fixture tool
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix tests/fixtures/product
          tests/fixtures/product/node_modules/.bin/playwright install --with-deps chromium
      - name: Parallel UI and UX browser isolation, owned cleanup and whole-round recovery
        run: |
          python3 -B tests/probes/parallel_product_check.py --binary "$HOME/.local/bin/prifly" \
            --browser-library "$PWD/tests/fixtures/product/node_modules/playwright" \
            --jobs 3 --report /tmp/aif-parallel-product-results.json
      - name: Sealed frontend grants, provenance and cleanup boundaries
        run: python3 -B tests/test_frontend_parallel.py
      - name: Whole feature UI and UX sessions, admission and lifecycle
        run: |
          python3 -B tests/probes/feature_uiux_check.py --binary "$HOME/.local/bin/prifly" \
            --browser-library "$PWD/tests/fixtures/product/node_modules/playwright" \
            --jobs 3 --report /tmp/aif-feature-uiux-results.json

  call-review-uiux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install latest stable Pri-Fly
        run: |
          prifly_installer="$(mktemp)"
          curl --fail --location --silent --show-error https://github.com/StenHigh/prifly/releases/latest/download/install.sh -o "$prifly_installer"
          sh "$prifly_installer"
          rm -f "$prifly_installer"
          "$HOME/.local/bin/prifly" version
      - name: Prepare project example tools
        run: |
          python3 -m venv --system-site-packages /tmp/w6-tools
          /tmp/w6-tools/bin/pip install -r examples/review-uiux-extensions/requirements.txt
      - name: Project install, original source and freshness contracts
        run: |
          /tmp/w6-tools/bin/python -B tools/build_review_uiux_bundle.py --check
          /tmp/w6-tools/bin/python -B tests/test_call_review.py
          /tmp/w6-tools/bin/python -B tests/call_review_contract.py --binary "$HOME/.local/bin/prifly" --report /tmp/w6-contract.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install sealed browser fixture
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix tests/fixtures/product
          tests/fixtures/product/node_modules/.bin/playwright install --with-deps chromium
      - name: Native calls, original artifacts, browser and continuation
        run: |
          /tmp/w6-tools/bin/python -B tests/probes/call_review_check.py --binary "$HOME/.local/bin/prifly" \
            --matrix --jobs 3 --browser-library "$PWD/tests/fixtures/product/node_modules/playwright" \
            --report /tmp/w6-native.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w6-call-review-results
          path: |
            /tmp/w6-contract.json
            /tmp/w6-native.json

name: verify

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pri-Fly from the latest stable release
        run: |
          install_file="$(mktemp)"
          curl --fail --location --silent --show-error \
            https://github.com/StenHigh/prifly/releases/latest/download/install.sh \
            -o "$install_file"
          sh "$install_file"
          rm -f "$install_file"
          "$HOME/.local/bin/prifly" version
      - name: Static folder contract
        run: python3 -B tests/test_folders.py
      - name: Compile both packages with the installed Pri-Fly
        run: python3 -B tests/verify.py --binary "$HOME/.local/bin/prifly"

authoring: prifly-project-workflow/1
package:
  id: aif:package/fanout
  version: 1.2.0
  description: Optional AI Factory plan refinement with independent review perspectives.
  requires_core_protocol: "1"
  references:
    aggregate_manifest_schema: core:schema/aggregate-manifest@1.0.0
    assisted_adapter: core:adapter/assisted-session@1.0.0
    local_policy: core:policy/local@3.0.0
    step_result_schema: core:schema/step-result@1.0.0
id: aif:workflow/fanout
schema_version: "4"
version: 1.2.0
title: AI Factory fan-out plan refinement
refs:
  schema_plan: "{{schema_plan}}"
  workflow_improve-pass: "{{workflow_improve-pass}}"
  local_policy: "{{local_policy}}"
inputs: {plan: schema_plan}
outputs:
  plan: {schema_ref: schema_plan, required_for: [succeeded]}
limits: {max_step_instances: 8, max_control_transitions: 64, max_parallelism: 2, max_child_depth: 2}
policy_ref: local_policy
entry: improve
stages:
  improve:
    kind: call
    workflow_ref: workflow_improve-pass
    input_bindings: {plan: $inputs.plan}
    on: {succeeded: done}
  done:
    kind: finish
    outcome: succeeded
    output_bindings: {plan: $stages.improve.plan}

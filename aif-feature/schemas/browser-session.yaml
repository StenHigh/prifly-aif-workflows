id: aif-feature:schema/browser-session
version: 1.0.0
$schema: https://json-schema.org/draft/2020-12/schema
type: object
additionalProperties: false
required:
- lens
- run_id
- owner
- protocol
- status
- reason
- round
- environment_session
- context_id
- identity_id
- allocation
- candidate_digest
- configuration_digest
- request_digest
- adapter_digest
properties:
  lens:
    enum:
    - ui
    - ux
  run_id:
    type: string
    minLength: 1
    maxLength: 4000
  owner:
    type: string
    minLength: 1
    maxLength: 4000
  protocol:
    const: aif-feature-browser/1
  status:
    enum:
    - ready
    - unavailable
  reason:
    type: string
    maxLength: 4000
  round:
    type: integer
    minimum: 1
    maximum: 8
  environment_session:
    type:
    - string
    - 'null'
  context_id:
    type:
    - string
    - 'null'
  identity_id:
    type:
    - string
    - 'null'
  allocation:
    type: object
  candidate_digest:
    type: string
    pattern: ^sha256:[0-9a-f]{64}$
  configuration_digest:
    type: string
    pattern: ^sha256:[0-9a-f]{64}$
  request_digest:
    type: string
    pattern: ^sha256:[0-9a-f]{64}$
  adapter_digest:
    type: string
    pattern: ^sha256:[0-9a-f]{64}$
allOf:
- if:
    properties:
      status:
        const: ready
  then:
    properties:
      context_id:
        type: string
        minLength: 1
        maxLength: 4000
      identity_id:
        type: string
        minLength: 1
        maxLength: 4000
      environment_session:
        type: string
        minLength: 1
        maxLength: 4000

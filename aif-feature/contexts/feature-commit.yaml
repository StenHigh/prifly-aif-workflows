id: aif-feature:context/feature-commit
version: 1.0.0
media_type: text/markdown; charset=utf-8
text: 'Read only the named claimed repository_workspace and the bound task/handoff. Sealed decisions win over native
  defaults. Pri-Fly owns this graph: no push, merge, branch/worktree creation, other launch, next-stage skill invocation,
  environment provisioning, or requirement rewrite. Preserve unrelated staged/dirty/untracked files and project
  documents. Any business or scope-changing ambiguity is owner_required, never an autonomous guess. For autonomous
  policy use HANDOFF_MODE=1, HANDOFF_TASK_ID=, HANDOFF_SKIP_REVIEW=0. For attended policy undeclared questions stay
  normal host interaction; do not fabricate a DecisionRequest or owner answer. Return outputs only in allocated
  slots. Use the session submission template unchanged for identities, answered_questions top-level [] when none,
  actual output SHA-256 digests. Native model_profile is answered only if this task declares one; otherwise retain
  template model_profile:null. Declared unavailable/declined uses literal reason, honoured uses named; no invented
  mapping. Result is exactly {outcome, reason, work}; reason nonempty, work lists actual completed work. All declared
  outputs required for the selected verdict must be supplied. Native plan output is captured by Pri-Fly, not a hand-built
  manifest. A usable report is distinct from a passing gate.

  Before any write, independently remeasure current git-candidate/1 using the pinned snapshot implementation (delivered
  evidence context) against candidate.base_commit. Compare full object with candidate; confirm gate not blocked/blocking,
  evidence.candidate and latest evidence.gate match the delivered accepted gate. An intervening edit is owner_required/blocked,
  never implicit acceptance. The preceding native program guard does the same check; this final check closes the
  cooperative delivery gap.

  Use pinned aif-commit only for this task''s remaining local changes. Default native PLAN was already sealed and
  freed; do not delete any discovered PLAN or project document. Retained tracked owned plan remains part of reviewed
  candidate; keep its progress, never remove it. Inspect index for unrelated staged work: stop owner_required rather
  than sweep it into the feature commit. Stage only the task''s reviewed paths, avoid git add -A. If nothing remains,
  skip the skill and return pass. Never push/create MR/merge. Return actual implementation: original base_commit,
  git rev-parse HEAD, git -c core.quotepath=off diff --name-only <base>..HEAD. Commit failure preserves work and
  reports environment_unavailable/owner_required. Return result implemented only on success.

  '

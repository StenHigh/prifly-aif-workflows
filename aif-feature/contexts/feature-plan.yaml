id: aif-feature:context/feature-plan
version: 1.0.0
media_type: text/markdown; charset=utf-8
text: 'Read only the named claimed repository_workspace and the bound task/handoff. Sealed decisions win over native
  defaults. Pri-Fly owns this graph: no push, merge, branch/worktree creation, other launch, next-stage skill invocation,
  environment provisioning, or requirement rewrite. Preserve unrelated staged/dirty/untracked files and project
  documents. Any business or scope-changing ambiguity is owner_required, never an autonomous guess. For autonomous
  policy use HANDOFF_MODE=1, HANDOFF_TASK_ID=, HANDOFF_SKIP_REVIEW=0. For attended policy undeclared questions stay
  normal host interaction; do not fabricate a DecisionRequest or owner answer. Return outputs only in allocated
  slots. Use the session submission template unchanged for identities, answered_questions top-level [] when none,
  actual output SHA-256 digests. Native model_profile is answered only if this task declares one; otherwise retain
  template model_profile:null. Declared unavailable/declined uses literal reason, honoured uses named; no invented
  mapping. Result is exactly {outcome, reason, work}; reason nonempty, work lists actual completed work. All declared
  outputs required for the selected verdict must be supplied. Native plan output is captured by Pri-Fly, not a hand-built
  manifest. A usable report is distinct from a passing gate.

  Invoke pinned aif-plan fast on task.description EXACTLY as the original request, with supplied scope, assumptions
  and named check descriptions as additional requirements. Read pinned TASK-FORMAT.md; use its native template,
  not an alternate spec. Use the warmup handoff for discovery. Include verifiable acceptance criteria and bounded
  scope; assumptions supplied by the owner are not permission to invent new behavior. plan_tests/plan_constraints
  are declared decisions; include explicitly chosen test tasks. For this compact route Docs:no (feature docs can
  be an explicit task), roadmap linkage:none; preserve required native Original Request, Settings and Tasks. Criteria
  are supplied in task.checks/security/review/product and must correspond to the native plan. Commands written into
  acceptance must have their syntax verified on the current tree; do not fake success for not-yet-implemented behavior.

  The only captured native fast path is .ai-factory/PLAN.md. Read project config paths.plan: if configured differently,
  stop owner_required before creating a plan; do not rewrite project config. Existing fast/fix/branch plans are
  other work, never overwrite/execute them. Pri-Fly independently refuses occupied output paths. Aim for a small
  coherent feature; if meaningful work exceeds four native implementation/test tasks, needs migration/architecture/business
  decisions or unresolved requirement conflict, return too_large/owner_required with concrete reason and preserved
  work, no plan execution or auto classic Run. Return ready only when native plan exists and criteria/scope are
  settled. A ready result requires pass; other outcomes use needs_revision/blocked and retain diagnosis.

  plan_retention=capture: leave the owned plan untracked for native seal-and-remove; do not stage it. plan_retention=retain:
  stage ONLY the newly created owned .ai-factory/PLAN.md (literal path), so native capture retains its bytes. Never
  delete or replace a tracked plan. Staging a plan is not permission to stage unrelated work.


  Released Core captures every workspace_tree output even on non-pass. If the upstream skill stops before a ready
  plan, do not fabricate executable tasks or claim plan_ready. Write only a BLOCKED diagnostic snapshot at the owned
  empty native path using TASK-FORMAT sections: exact Original Request, Settings, blocking reason, scope/assumptions/criteria,
  and Tasks with no executable tasks. This wrapper snapshot is explicitly not an implementation-ready plan. Return
  matching owner_required/environment_unavailable/too_large result with blocked/needs_revision; the root consumes
  only the result and cannot execute this snapshot. Pri-Fly seals and frees only these owned untracked bytes. Do
  not create or modify authoritative requirements.


  The pinned downstream logging-guide is also supplied to the planner. Every implementation task must respect its
  configurable runtime logging (stdlib logging/LOG_LEVEL for Python where applicable). Preserve exact function results;
  logging can be disabled. Do not invent a prohibition on runtime logging or substitute session notes for required
  code logging. If project rules explicitly conflict, return owner_required rather than silently change either source.


  Scheduling boundary: native Tasks contain scoped implementation and unit/static tests executable before quality.
  The separate workflow owns command acceptance, security, code review and (frontend) environment setup, actual
  UI and UX readers AFTER implementation. Keep all their criteria in the native Acceptance/Verification section,
  explicitly assigned to the later quality phase. Do not make environment setup, independent readers or actual browser
  acceptance a pending implementation Task; this would depend on a later stage and deadlock the route. plan_tests=true
  still requires suitable native unit/static test tasks within scope. A browser check is never satisfied by those
  tests; the required W2 readers must execute it later. No hidden provisioning or criterion removal.

  '

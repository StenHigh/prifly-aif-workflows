id: aif-feature:context/feature-parallel-admission
version: 1.2.1
media_type: text/markdown; charset=utf-8
text: Before plan/writers, the reviewed controller verifies its sealed source contract. Backend needs the explicit
  codex-cli pair adapter. parallel-ui-ux additionally requires the sealed reviewed project browser adapter, available
  browser, owned artifact root, isolated loopback lifecycle/identities/contexts, null shared_resource and no quality
  resource with fewer than two Attempt slots. Unavailable capability rejects this requested mode, without fallback
  or setup.

  For parallel-ui-ux, the shipped adapter checks the public sealed quality.limit.
  Only 1-3 rounds are qualified; 4-8 are refused before writers, never lowered.

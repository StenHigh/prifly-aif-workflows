authoring: prifly-step/1
id: aif-feature:step/aggregate-parallel
version: 1.2.2
title: Verify sealed backend report bytes and complete W1 coverage
kind: worker
inputs:
  task:
    schema_ref: '{{schema_task}}'
  implementation:
    schema_ref: '{{schema_implementation}}'
  candidate:
    schema_ref: '{{schema_candidate}}'
  round:
    schema_ref: '{{schema_round}}'
  checks_request:
    schema_ref: '{{schema_request}}'
  checks_report:
    schema_ref: '{{schema_report}}'
  security_request:
    schema_ref: '{{schema_request}}'
  review_request:
    schema_ref: '{{schema_request}}'
  manifest:
    schema_ref: '{{aggregate_manifest}}'
  bundle:
    schema_ref: '{{schema_report-bundle}}'
outputs:
  gate:
    schema_ref: '{{schema_feature-gate}}'
    required_for:
    - pass
  evidence:
    schema_ref: '{{schema_evidence}}'

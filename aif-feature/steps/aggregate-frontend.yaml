    schema_ref: '{{schema_implementation}}'
  candidate:
    schema_ref: '{{schema_candidate}}'
  round:
    schema_ref: '{{schema_round}}'
  checks_request:
    schema_ref: '{{schema_request}}'
  checks_report:
    schema_ref: '{{schema_report}}'
  security_request:
    schema_ref: '{{schema_request}}'
  security_report:
    schema_ref: '{{schema_report}}'
  review_request:
    schema_ref: '{{schema_request}}'
  review_report:
    schema_ref: '{{schema_report}}'
  product_gate:
    schema_ref: '{{schema_gate}}'
  ui_report:
    schema_ref: '{{schema_report}}'
  ux_report:
    schema_ref: '{{schema_report}}'
  environment:
    schema_ref: '{{schema_environment}}'
  release:
    schema_ref: '{{schema_release}}'
outputs:

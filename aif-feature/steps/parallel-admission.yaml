authoring: prifly-step/2
id: aif-feature:step/parallel-admission
version: 1.2.0
title: Admit independent CLI review host
kind: worker
inputs:
  review_mode:
    schema_ref: '{{schema_review-mode}}'
  task:
    schema_ref: '{{schema_task}}'
  browser_adapter:
    schema_ref: '{{schema_browser-adapter}}'
outputs:
  admission:
    schema_ref: '{{schema_parallel-admission}}'
    required_for:
    - pass
    - needs_revision
    - blocked
executor:
  adapter_ref: '{{session}}'
  operation: session
instructions_ref: '{{context_feature-parallel-admission}}'
context_refs:
- '{{context_parallel-adapter-contract}}'
effects:
  class: none
  retry_class: pure
session_limits:
  active_timeout_ms: null
result_schema_ref: '{{result_v2}}'
repository_workspace: read_only

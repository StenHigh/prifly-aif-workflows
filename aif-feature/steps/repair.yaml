authoring: prifly-step/2
id: aif-feature:step/repair
version: 1.0.0
title: Bounded feature repair
kind: worker
inputs:
  task:
    schema_ref: '{{schema_task}}'
  handoff:
    schema_ref: '{{schema_warmup-handoff}}'
  implementation:
    schema_ref: '{{schema_implementation}}'
  result:
    schema_ref: '{{schema_result}}'
  gate:
    schema_ref: '{{schema_feature-gate}}'
outputs:
  implementation:
    schema_ref: '{{schema_implementation}}'
    required_for:
    - pass
    - needs_revision
    - blocked
    - fail
    - no_work
  result:
    schema_ref: '{{schema_result}}'
    required_for:
    - pass
    - needs_revision
    - blocked
    - fail
    - no_work
executor:
  adapter_ref: '{{session}}'
  operation: session
instructions_ref: '{{context_feature-repair}}'
context_refs:
- '{{context_aif-implement}}'
- '{{context_logging-guide}}'
effects:
  class: workspace_write
  retry_class: never
session_limits:
  active_timeout_ms: null
result_schema_ref: '{{result_v2}}'

authoring: prifly-workflow/1
schema_version: "6"
id: aif-fix:workflow/quality
version: 1.0.2
title: quality for aif-fix
refs:
  schema_task: "{{schema_task}}"
  schema_warmup-handoff: "{{schema_warmup-handoff}}"
  schema_implementation: "{{schema_implementation}}"
  schema_fix-result: "{{schema_fix-result}}"
  schema_gate-result: "{{schema_gate-result}}"
  schema_plan: "{{workspace_tree_manifest}}"
  schema_feature-enabled: "{{schema_feature-enabled}}"
  schema_round-limit: "{{schema_round-limit}}"
  local_policy: "{{local_policy}}"
  workflow_quality-round: "{{workflow_quality-round}}"
inputs:
  task: schema_task
  handoff: schema_warmup-handoff
  implementation: schema_implementation
  result: schema_fix-result
  repair_round_limit:
    schema_ref: schema_round-limit
    required: false
    configuration: {scope: project, default: 3}
outputs:
  implementation: {schema_ref: schema_implementation, required_for: [succeeded, partial]}
  result: {schema_ref: schema_fix-result, required_for: [succeeded, partial]}
  gate: {schema_ref: schema_gate-result, required_for: [succeeded, partial]}
limits: {max_step_instances: 32, max_control_transitions: 224, max_parallelism: 1, max_child_depth: 2}
policy_ref: local_policy
entry: round
stages:
  round:
    kind: repeat
    body_workflow_ref: workflow_quality-round
    initial_bindings: {task: $inputs.task, handoff: $inputs.handoff, implementation: $inputs.implementation, result: $inputs.result}
    next_bindings: {task: $inputs.task, handoff: $inputs.handoff, implementation: $iteration.implementation, result: $iteration.result}
    continue_on: [partial]
    until: false
    max_iterations: 8
    limit_configuration: repair_round_limit
    on_complete: {succeeded: passed, rejected: standing, no_work: stopped}
    on_limit: standing
  passed:
    kind: finish
    outcome: succeeded
    output_bindings: {implementation: $stages.round.implementation, result: $stages.round.result, gate: $stages.round.gate}
  standing:
    kind: finish
    outcome: partial
    output_bindings: {implementation: $stages.round.implementation, result: $stages.round.result, gate: $stages.round.gate}
  stopped: {kind: finish, outcome: rejected}

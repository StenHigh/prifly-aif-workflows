authoring: prifly-step/2
id: aif-fix:step/review-task
version: 1.0.0
title: review-task for the bug workflow
kind: worker
inputs:
  task: {schema_ref: "{{schema_task}}"}
  handoff: {schema_ref: "{{schema_warmup-handoff}}"}
  implementation: {schema_ref: "{{schema_implementation}}"}
  result: {schema_ref: "{{schema_fix-result}}"}
outputs:
  gate: {schema_ref: "{{schema_gate-result}}", required_for: [pass, needs_revision, blocked]}
executor: {adapter_ref: "{{assisted_adapter}}", operation: session}
session_limits: {active_timeout_ms: null}
result_schema_ref: "{{step_result_schema_v2}}"
instructions_ref: "{{context_review-task-bridge}}"
context_refs: ["{{context_aif-review}}"]
effects: {class: none, retry_class: pure}
repository_workspace: read_only
model_profile: {requested: independent-review, reason: "One reviewer session without the author conversation; report unavailable when the host cannot provide it."}

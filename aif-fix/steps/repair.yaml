authoring: prifly-step/2
id: aif-fix:step/repair
version: 1.0.1
title: repair for the bug workflow
kind: worker
inputs:
  task: {schema_ref: "{{schema_task}}"}
  handoff: {schema_ref: "{{schema_warmup-handoff}}"}
  implementation: {schema_ref: "{{schema_implementation}}"}
  result: {schema_ref: "{{schema_fix-result}}"}
  gate: {schema_ref: "{{schema_gate-result}}"}
outputs:
  implementation: {schema_ref: "{{schema_implementation}}", required_for: [pass, needs_revision, blocked, fail, no_work]}
  result: {schema_ref: "{{schema_fix-result}}", required_for: [pass, needs_revision, blocked, fail, no_work]}
executor: {adapter_ref: "{{assisted_adapter}}", operation: session}
session_limits: {active_timeout_ms: null}
result_schema_ref: "{{step_result_schema_v2}}"
instructions_ref: "{{context_repair-bridge}}"
context_refs: ["{{context_fix-protocol}}", "{{context_fix-path}}", "{{context_aif-fix}}", "{{context_session-report}}"]
effects: {class: workspace_write, retry_class: never}

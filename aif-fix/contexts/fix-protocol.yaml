id: aif-fix:context/fix-protocol
version: 1.0.0
media_type: text/markdown; charset=utf-8
text: |
  # Common contract for this Run's aif-fix Attempts

  The pinned aif-fix is supporting context. The primary bridge governs its
  mode and which stages run next. Work only in the claimed repository.
  Read the task, handoff, implementation, result and complete decision_context
  supplied to this Attempt; preserve declared answers. Load config and the
  mandatory project skill overlay when present. Follow its logging and patch
  requirements. Context/rules/architecture are read-only: a conflict with the
  expected behavior is owner_required, never permission to rewrite requirements.

      HANDOFF_MODE=1
      HANDOFF_TASK_ID=
      HANDOFF_SKIP_REVIEW=0

  These values apply even in attended mode: this Attempt reports and ends.
  Do not ask undeclared native questions or invoke Handoff MCP. Suggestions for
  additional tests are recorded, not an unanswered dialog. Pri-Fly owns the
  checks, security, review, repair and commit; invoke none of them yourself.

  The existing-plan discovery of the skill does not choose this task. A file
  already at paths.fix_plan is not automatically this Run's: direct fix and
  repair must ignore unrelated plans and never modify, execute or delete them.
  Only fix-from-plan uses the manifest supplied by this Run. In fix-plan,
  the pinned fix-path context contains the exact selected capture path.
  workspace-trees.json names the declared capture path. If config paths.fix_plan
  disagrees with that path, report owner_required before writing; request a
  reviewed package profile/plan path, not a runtime edit to configuration.

  Use the smallest behavior check. Capture its command/inputs and observed
  before/after output in result.regression: the result itself is sealed evidence.
  A rerunnable manual/runtime reproduction is valid. When no useful check
  exists, explain why and continue only if investigation established a plausible
  cause with a safe fix; otherwise outcome unreproduced, needs_revision, no
  implementation edits. Missing dependencies are environment_unavailable and
  blocked, not evidence that the change failed. A dependency broken by the
  change is a defect. Never fit a test to the planned implementation.

  For every verdict return result and implementation, including a stop with no
  edits. result is a closed object: outcome, reason, work (array of strings)
  execute_plan (boolean; false except an authorized prepared plan),
  and regression {check, before, after}. reason and regression.check <=4000
  characters; before/after <=8000 each; work <=80 strings each <=1000.
  outcome needs_planning is allowed only from fix-task, and leads to this
  workflow's own fix-plan and aif-fix execution, never aif-implement. planned
  is the planner's success. fixed is established behavior, not a guess.

  implementation.base_commit is always the input's original base; head_commit
  is git rev-parse HEAD; changed_files comes from git -c core.quotepath=off diff
  --name-only <base_commit> plus untracked paths, not the old artifact's list.
  Carry checkpoint commits, dirty/untracked work and prior evidence forward.
  No reset, clean, implicit restart or automatic change to another workflow.
  On resume inspect the actual tree before editing and update the evidence;
  inherited results do not establish the behavior of a changed tree.

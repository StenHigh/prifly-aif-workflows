authoring: prifly-extension/5
# Task length: Core >=0.13.90 reads project/compile-values.yaml.
# Use {authoring: prifly-compile-values/1, values: {task_description_limit: 32000}}.
# Omit the owner file to keep 12000. This is a compile parameter, not settings.
# default: native untracked FIX_PLAN; custom: retained repository fix-plan.
profile: default
settings:
  quality: {repair_round_limit: 3}
exclude: []
extensions: []
# Generic project insertions may use root build -> quality or commit -> done.
# Insertion steps declare no inputs and answer pass/needs_revision/fail/no_work/blocked.

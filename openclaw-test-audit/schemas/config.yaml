id: openclaw:schema/config
version: 1.0.0
$schema: https://json-schema.org/draft/2020-12/schema
type: object
required:
- base_commit
- round
- test_patterns
- require_separate_session
additionalProperties: false
properties:
  base_commit:
    type: string
    pattern: ^[0-9a-f]{40}$
  round:
    type: integer
    minimum: 1
    maximum: 10000
  test_patterns:
    type: array
    items:
      type: string
      minLength: 1
      maxLength: 4000
    minItems: 1
    maxItems: 80
  require_separate_session:
    type: boolean

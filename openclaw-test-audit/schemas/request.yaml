id: openclaw:schema/request
version: 1.0.0
$schema: https://json-schema.org/draft/2020-12/schema
type: object
required:
- config
- candidate
- paths
additionalProperties: false
properties:
  config:
    type: object
    required:
    - base_commit
    - round
    - test_patterns
    - require_separate_session
    additionalProperties: false
    properties:
      base_commit:
        type: string
        pattern: ^[0-9a-f]{40}$
      round:
        type: integer
        minimum: 1
        maximum: 10000
      test_patterns:
        type: array
        items:
          type: string
          minLength: 1
          maxLength: 4000
        minItems: 1
        maxItems: 80
      require_separate_session:
        type: boolean
  candidate:
    type: object
    required:
    - algorithm
    - base_commit
    - head_commit
    - index_digest
    - files_digest
    - digest
    additionalProperties: false
    properties:
      algorithm:
        const: git-candidate/1
      base_commit:
        type: string
        pattern: ^[0-9a-f]{40}$
      head_commit:
        type: string
        pattern: ^[0-9a-f]{40}$
      index_digest:
        type: string
        pattern: ^sha256:[0-9a-f]{64}$
      files_digest:
        type: string
        pattern: ^sha256:[0-9a-f]{64}$
      digest:
        type: string
        pattern: ^sha256:[0-9a-f]{64}$
  paths:
    type: array
    items:
      type: string
      minLength: 1
      maxLength: 4000
    minItems: 1
    maxItems: 200
    uniqueItems: true

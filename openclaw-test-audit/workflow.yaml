authoring: prifly-project-workflow/1
package:
  id: openclaw:package/test-audit
  version: 1.1.0
  description: Independent read-only audit of changed tests; no automatic integration into other workflows.
  requires_core_protocol: '1'
  references:
    process: core:adapter/local-process@2.0.0
    session: core:adapter/assisted-session@1.0.0
    policy: core:policy/local@4.0.0
    result: core:schema/step-result@1.0.0
    result_v2: core:schema/step-result@2.0.0
id: openclaw:workflow/test-audit
schema_version: '8'
version: 1.1.0
title: Audit changed tests
refs:
  step_configure: '{{step_configure}}'
  workflow_quality: '{{workflow_quality}}'
  schema_config: '{{schema_config}}'
  schema_gate: '{{schema_gate}}'
  schema_report: '{{schema_report}}'
  policy: '{{policy}}'
inputs:
  config:
    schema_ref: schema_config
outputs:
  gate:
    schema_ref: schema_gate
    required_for:
    - succeeded
    - partial
  report:
    schema_ref: schema_report
    required_for:
    - succeeded
    - partial
policy_ref: policy
resumable:
  from_outcomes:
  - partial
  - rejected
  from_cancelled: true
entry: configure
limits:
  max_step_instances: 4
  max_control_transitions: 20
  max_parallelism: 1
  max_child_depth: 2
stages:
  configure:
    kind: step
    step_ref: step_configure
    input_bindings:
      config: $inputs.config
    'on':
      pass: quality
      needs_revision: abandoned
      fail: abandoned
      no_work: abandoned
    impossible_verdicts:
    - blocked
  quality:
    kind: call
    workflow_ref: workflow_quality
    input_bindings:
      config: $stages.configure.config
    'on':
      succeeded: done
      partial: standing
      rejected: abandoned
  done:
    kind: finish
    outcome: succeeded
    output_bindings:
      gate: $stages.quality.gate
      report: $stages.quality.report
  standing:
    kind: finish
    outcome: partial
    output_bindings:
      gate: $stages.quality.gate
      report: $stages.quality.report
  abandoned:
    kind: finish
    outcome: rejected
execution_bindings:
  steps:
    openclaw:step/configure:
      executable: python
      args:
      - -B
      - audit.py
      - configure
      files:
        audit.py: files/audit.py
        candidate.py: files/candidate.py
      timeout_ms: 120000
      grace_ms: 100
      max_output_bytes: 4194304
    openclaw:step/prepare:
      executable: python
      args:
      - -B
      - audit.py
      - prepare
      files:
        audit.py: files/audit.py
        candidate.py: files/candidate.py
      timeout_ms: 120000
      grace_ms: 100
      max_output_bytes: 4194304
    openclaw:step/evaluate:
      executable: python
      args:
      - -B
      - audit.py
      - evaluate
      files:
        audit.py: files/audit.py
        candidate.py: files/candidate.py
      timeout_ms: 120000
      grace_ms: 100
      max_output_bytes: 4194304

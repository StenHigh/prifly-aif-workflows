authoring: prifly-step/2
id: aif-profiled-continuation:step/commit
version: 1.5.0
title: Run aif-commit after the selected quality gates
kind: worker
inputs:
  implementation: {schema_ref: "{{schema_implementation}}"}
outputs:
  implementation: {schema_ref: "{{schema_implementation}}", required_for: [pass]}
executor: {adapter_ref: "{{assisted_adapter}}", operation: session}
instructions_ref: "{{context_aif-commit-bridge}}"
context_refs: ["{{context_aif-commit}}"]
effects: {class: workspace_write, retry_class: never}
session_limits: {active_timeout_ms: null}
result_schema_ref: "{{step_result_schema}}"
model_profile:
  requested: fast-draft
  reason: >-
    Commit reads the tree, removes Run working state and records the head; nothing here needs depth.

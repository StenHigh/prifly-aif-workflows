authoring: prifly-step/2
id: aif-profiled-continuation:step/improve
version: 1.4.0
title: Run aif-improve and apply the developer's accepted plan changes
kind: worker
inputs:
  plan: {schema_ref: "{{workspace_tree_manifest}}"}
  handoff: {schema_ref: "{{schema_warmup-handoff}}"}
outputs:
  plan: {schema_ref: "{{workspace_tree_manifest}}", required_for: [pass, needs_revision]}
executor: {adapter_ref: "{{assisted_adapter}}", operation: session}
instructions_ref: "{{context_aif-improve-bridge}}"
context_refs:
  - "{{context_aif-improve}}"
  - "{{context_aif-improve-list-mode}}"
  - "{{context_aif-improve-check-mode}}"
  - "{{context_aif-improve-examples}}"
  - "{{context_aif-improve-validator}}"
effects: {class: workspace_write, retry_class: never}
session_limits: {active_timeout_ms: null}
result_schema_ref: "{{step_result_schema}}"
workspace_trees:
  - input_port: plan
    output_port: plan
    capture: "{{plan_capture}}"
model_profile:
  requested: careful-review
  reason: >-
    Improving a plan is reading it against the project and choosing what to take; it needs care rather than invention, and it must not widen the task.
